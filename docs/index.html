<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
:root{
  --bg:#f5f4f0;--card:#ffffff;--border:#e8e6e0;--text:#0a0a0a;--muted:#a0998a;
  --dark:#0a0a0a;--dark-fg:#ffffff;--green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;--amber:#d97706;--amber-bg:#fffbeb;
  --r:18px;--font:'DM Sans',sans-serif;--serif:'Playfair Display',serif;
}
html,body{height:100%;background:var(--bg);font-family:var(--font);color:var(--text);overflow:hidden;}
.app-shell{display:flex;height:100dvh;width:100%;position:relative;}
.main-col{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}

.page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 0 100px 0;}
.page-inner{padding:16px;}

.topbar{padding:52px 20px 12px;background:var(--bg);flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);gap:10px;}
.topbar-left h1{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:-0.03em;line-height:1.1;}
.topbar-left p{font-size:12px;color:var(--muted);margin-top:4px;}
.top-action{background:var(--dark);color:var(--dark-fg);border:none;border-radius:50px;padding:10px 18px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;white-space:nowrap;min-height:44px;display:flex;align-items:center;flex-shrink:0;}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--dark);display:flex;justify-content:space-around;align-items:center;padding:10px 4px calc(10px + env(safe-area-inset-bottom, 12px));z-index:100;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;cursor:pointer;padding:6px 2px;border-radius:12px;transition:background 0.15s;min-height:54px;justify-content:center;}
.nav-btn.active{background:rgba(255,255,255,0.1);}
.nav-icon{font-size:19px;}
.nav-label{font-size:9.5px;font-family:var(--font);font-weight:500;color:#666;letter-spacing:0.03em;}
.nav-btn.active .nav-label{color:#fff;}

.sidebar{display:none;flex-direction:column;width:224px;flex-shrink:0;background:var(--dark);padding:20px 12px;gap:2px;overflow-y:auto;}
.sidebar-brand{font-family:var(--serif);font-size:19px;font-weight:900;color:#fff;padding:6px 10px 18px;letter-spacing:-0.02em;}
.sidebar-group-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:0.1em;font-weight:700;padding:14px 12px 6px;}
.sidebar-btn{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;background:none;border:none;color:#999;font-family:var(--font);font-size:13px;cursor:pointer;text-align:left;width:100%;}
.sidebar-btn:hover{color:#ddd;}
.sidebar-btn.active{background:rgba(255,255,255,0.12);color:#fff;font-weight:600;}

@media (min-width:860px){
  html,body{overflow:hidden;}
  .sidebar{display:flex;}
  .bottom-nav{display:none;}
  .page-inner{max-width:800px;margin:0 auto;padding:28px 32px;}
  .topbar{padding:28px 32px 16px;}
}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.stat-card.dark{background:var(--dark);border-color:var(--dark);}
.stat-card.green{background:var(--green-bg);border-color:#bbf7d0;}
.stat-card.red{background:var(--red-bg);border-color:#fecaca;}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.stat-card.dark .stat-label{color:#555;}
.stat-value{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;color:var(--text);}
.stat-card.dark .stat-value{color:#fff;}
.stat-card.green .stat-value{color:var(--green);}
.stat-card.red .stat-value{color:var(--red);}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}
.stat-card.dark .stat-sub{color:#444;}

.field{margin-bottom:14px;}
.field-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;display:block;}
.input-wrap{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.15s;}
.input-wrap:focus-within{border-color:var(--dark);}
.input-suffix{padding:0 12px;font-size:15px;color:var(--muted);font-weight:500;}
.input-wrap input[type=text],.input-wrap input[type=number],.input-wrap input[type=date],.input-wrap input[type=month]{flex:1;border:none;background:transparent;padding:14px 14px;font-size:15px;color:var(--text);font-family:var(--font);outline:none;min-height:48px;min-width:0;}
.input-wrap input::placeholder{color:#ccc;}
.input-wrap input[type=file]{flex:1;padding:12px 14px;font-size:13px;font-family:var(--font);color:var(--text);}
select{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:14px;font-size:15px;color:var(--text);font-family:var(--font);background:var(--bg);outline:none;min-height:48px;-webkit-appearance:none;appearance:none;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:15px 20px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;min-height:52px;width:100%;transition:opacity 0.15s,transform 0.1s;}
.btn:active{opacity:0.85;transform:scale(0.98);}
.btn-dark{background:var(--dark);color:#fff;}
.btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border);}
.btn-red{background:var(--red-bg);color:var(--red);border:1.5px solid #fecaca;}
.btn-sm{min-height:38px;padding:8px 14px;font-size:13px;border-radius:10px;width:auto;}

.row-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;gap:10px;}
.row-item-left{flex:1;min-width:0;}
.row-item-name{font-size:14px;font-weight:600;color:var(--text);}
.row-item-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.amount{font-size:15px;font-weight:700;}
.amount.green{color:var(--green);}
.amount.red{color:var(--red);}

.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:50px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.red{background:var(--red-bg);color:var(--red);}
.pill.amber{background:var(--amber-bg);color:var(--amber);}

.divider{height:1px;background:var(--border);margin:14px 0;}

.progress-wrap{background:var(--border);border-radius:99px;height:8px;overflow:hidden;margin-top:8px;}
.progress-bar{height:100%;border-radius:99px;transition:width 0.4s;}

.del-btn{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:6px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:20px 20px calc(28px + env(safe-area-inset-bottom, 12px));max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px;}
.sheet-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:18px;}

.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty p{font-size:14px;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;}
.section-head h2{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}

.hidden{display:none!important;}

.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;font-size:14px;color:var(--muted);font-family:var(--font);cursor:pointer;padding:0;margin-bottom:16px;}

.sale-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);gap:10px;}
.sale-row:last-child{border-bottom:none;}

.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-bar input[type=text],.filter-bar input[type=date],.filter-bar input[type=month]{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:var(--font);background:var(--card);outline:none;flex:1;min-width:130px;}

.type-tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:16px;}
.type-tab{flex:1;padding:9px 4px;border:none;background:none;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--font);cursor:pointer;}
.type-tab.active{background:var(--dark);color:#fff;}

.danger-zone{border:1.5px solid #fecaca;border-radius:14px;padding:16px;background:var(--red-bg);}

.doc-section{margin-bottom:20px;}
.doc-section h3{font-family:var(--serif);font-size:16px;font-weight:700;margin-bottom:8px;}
.doc-section p{font-size:13.5px;line-height:1.65;color:#333;margin-bottom:8px;}
.doc-section ul{margin:6px 0 10px 20px;}
.doc-section li{font-size:13.5px;line-height:1.65;color:#333;margin-bottom:5px;}
.callout{background:var(--amber-bg);border:1px solid #fde68a;border-radius:14px;padding:14px 16px;font-size:12.5px;color:#92400e;line-height:1.6;margin-bottom:16px;}
.callout.info{background:#eff6ff;border-color:#bfdbfe;color:#1e40af;}
.callout b{font-weight:700;}

#bm-toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:9px 18px;border-radius:50px;font-size:12px;font-family:var(--font);font-weight:500;z-index:500;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
@media (min-width:860px){ #bm-toast{bottom:24px;} }
</style>
</head>
<body>
<div class="app-shell" id="app">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main-col">
    <div class="topbar" id="topbar">
      <div class="topbar-left">
        <h1 id="page-title">Overview</h1>
        <p id="page-sub">Your brand at a glance</p>
      </div>
      <button class="top-action hidden" id="top-action-btn" onclick="openAddSheet()">+ Add</button>
    </div>
    <div class="page" id="main-page">
      <div class="page-inner" id="page-content"></div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="navigate('dashboard')" id="nav-dashboard"><span class="nav-icon">◈</span><span class="nav-label">Overview</span></button>
    <button class="nav-btn" onclick="navigate('entries')" id="nav-entries"><span class="nav-icon">📒</span><span class="nav-label">Entries</span></button>
    <button class="nav-btn" onclick="navigate('products')" id="nav-products"><span class="nav-icon">📦</span><span class="nav-label">Products</span></button>
    <button class="nav-btn" onclick="navigate('report')" id="nav-report"><span class="nav-icon">📊</span><span class="nav-label">Report</span></button>
    <button class="nav-btn" onclick="openMoreMenu()" id="nav-more"><span class="nav-icon">☰</span><span class="nav-label">More</span></button>
  </nav>
</div>

<div class="sheet-overlay hidden" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheet-content"></div></div>
</div>

<script>
// ── DATA MODEL ─────────────────────────────────────────────────────────────
const KEY = 'bm_data_v5';
const LEGACY_KEY_V4 = 'bm_data_v4';
const LEGACY_KEY_V3 = 'bm_data_v3';
let data = null;
let currentView = 'dashboard';
let routeExtra = null;

const INCOME_CATS = ['Product Sales','Pop-Up / Market','Wholesale','Other Income'];
const EXPENSE_CATS = ['Bulk Production','Samples','Packaging & Shipping','Marketing & Ads','Taxes & Fees','Software & Tools','Studio / Rent','Market Stall / Event','Other'];
const FIXED_COST_CATS = ['Rent','Software & Tools','Insurance','Subscriptions','Loan / Leasing','Other'];
const DROP_BUDGET_CATS = ['Bulk Production','Samples','Taxes & Fees','Marketing','Packaging & Shipping','Fixed Costs','Other'];

function defaultData(){
  return { meta:{businessName:'My Brand'}, income:[], expenses:[], fixedCosts:[], products:[], drops:[], samples:[] };
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(data)); }catch(e){} }

function load(){
  data = defaultData();
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = JSON.parse(raw);
      data = {
        meta: d.meta || defaultData().meta,
        income: Array.isArray(d.income) ? d.income : [],
        expenses: Array.isArray(d.expenses) ? d.expenses : [],
        fixedCosts: Array.isArray(d.fixedCosts) ? d.fixedCosts : [],
        products: Array.isArray(d.products) ? d.products : [],
        drops: Array.isArray(d.drops) ? d.drops : [],
        samples: Array.isArray(d.samples) ? d.samples : []
      };
      return;
    }
    const v4raw = localStorage.getItem(LEGACY_KEY_V4);
    if(v4raw){ migrateFromV4(JSON.parse(v4raw)); window._migrated=true; return; }
    const v3raw = localStorage.getItem(LEGACY_KEY_V3);
    if(v3raw){ migrateFromV3(JSON.parse(v3raw)); window._migrated=true; return; }
  }catch(e){}
}

function migrateFromV4(old){
  data = defaultData();
  data.meta.businessName = (old.meta && old.meta.businessName) || 'My Brand';
  data.products = (old.products||[]).map(p=>{ const copy = Object.assign({}, p); delete copy.sales; delete copy.costPosted; return copy; });
  (old.products||[]).forEach(p=>{
    (p.sales||[]).forEach(s=>{
      if(n(s.amount)<=0) return;
      data.income.push({id:uid(), date:s.date||isoToday(), amount:n(s.amount), description:s.note||'', category:'Product Sales', productId:p.id, units:1, dropId:null, fileId:null, ts:Date.now()});
    });
  });
  (old.entries||[]).forEach(en=>{
    if(['invoice-payment','bill-payment','transfer','journal','product-sale'].includes(en.sourceType)) return;
    const amount = (en.lines||[]).reduce((s,l)=>s+n(l.debit),0);
    if(amount<=0) return;
    const dLine = (en.lines||[]).find(l=>n(l.debit)>0);
    const cLine = (en.lines||[]).find(l=>n(l.credit)>0);
    const dAcct = dLine ? (old.accounts||[]).find(a=>a.id===dLine.accountId) : null;
    const cAcct = cLine ? (old.accounts||[]).find(a=>a.id===cLine.accountId) : null;
    if(cAcct && cAcct.type==='income'){
      data.income.push({id:uid(), date:en.date, amount, description:en.memo||'', category:cAcct.name, productId:null, units:null, dropId:null, fileId:en.fileId||null, ts:en.ts||Date.now()});
    } else if(dAcct && dAcct.type==='expense'){
      data.expenses.push({id:uid(), date:en.date, amount, description:en.memo||'', category:dAcct.name, dropId:null, dropCategory:null, fileId:en.fileId||null, ts:en.ts||Date.now()});
    }
  });
  (old.budgets||[]).forEach(b=>{
    const acct = (old.accounts||[]).find(a=>a.id===b.accountId);
    data.fixedCosts.push({id:uid(), name:b.name||'Budget', amount:n(b.limit), category:acct?acct.name:'Other', active:true});
  });
  save();
}

function migrateFromV3(old){
  data = defaultData();
  (old.products||[]).forEach(p=>{
    (p.sales||[]).forEach(s=>{
      if(n(s.amount)<=0) return;
      data.income.push({id:uid(), date:isoToday(), amount:n(s.amount), description:s.note||'', category:'Product Sales', productId:p.id, units:1, dropId:null, fileId:null, ts:Date.now()});
    });
  });
  data.products = (old.products||[]).map(p=>{ const copy = Object.assign({}, p); delete copy.sales; return copy; });
  (old.expenses||[]).forEach(e=>{
    const amt = n(e.amount); if(amt<=0) return;
    data.expenses.push({id:uid(), date:isoToday(), amount:amt, description:e.name||'', category:e.category||'Other', dropId:null, dropCategory:null, fileId:null, ts:Date.now()});
  });
  (old.budgets||[]).forEach(b=>{
    data.fixedCosts.push({id:uid(), name:b.name||'Budget', amount:n(b.limit), category:b.category||'Other', active:true});
  });
  save();
}

// ── FILE STORAGE (IndexedDB) ──────────────────────────────────────────────
const FILES_DB = 'bm_files_db_v1';
const FILES_STORE = 'files';
function openFilesDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){ reject(new Error('IndexedDB not supported in this browser')); return; }
    const req = indexedDB.open(FILES_DB, 1);
    req.onupgradeneeded = e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(FILES_STORE)) db.createObjectStore(FILES_STORE, {keyPath:'id'});
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e.target.error);
  });
}
async function dbPutFile(rec){
  const db = await openFilesDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(FILES_STORE,'readwrite');
    tx.objectStore(FILES_STORE).put(rec);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}
async function dbGetAllFiles(){
  const db = await openFilesDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(FILES_STORE,'readonly');
    const req = tx.objectStore(FILES_STORE).getAll();
    req.onsuccess=()=>resolve(req.result||[]);
    req.onerror=()=>reject(req.error);
  });
}
async function dbGetFile(id){
  const db = await openFilesDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(FILES_STORE,'readonly');
    const req = tx.objectStore(FILES_STORE).get(id);
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
async function dbDeleteFile(id){
  const db = await openFilesDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(FILES_STORE,'readwrite');
    tx.objectStore(FILES_STORE).delete(id);
    tx.oncomplete=()=>resolve();
    tx.onerror=()=>reject(tx.error);
  });
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const n = v => parseFloat(v)||0;
const fmt = v => n(v).toLocaleString('de-AT', {style:'currency', currency:'EUR'});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isoToday = () => new Date().toISOString().slice(0,10);
const today = () => new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDateShort(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtSize(bytes){ bytes=bytes||0; if(bytes<1024) return bytes+' B'; if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1024/1024).toFixed(1)+' MB'; }
function ym(dateIso){ return (dateIso||isoToday()).slice(0,7); }
function monthLabel(ymStr){ const parts=(ymStr||'').split('-'); const y=parseInt(parts[0],10), m=parseInt(parts[1],10); if(!y||!m) return ymStr; const d=new Date(y,m-1,1); return d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
let toastTimer;
function toast(msg){
  let t = $('bm-toast');
  if(!t){ t=document.createElement('div'); t.id='bm-toast'; document.body.appendChild(t); }
  t.textContent = '✓ '+msg;
  t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.opacity='0'; }, 1600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function calcProduct(p){
  const bulk=n(p.bulkCost), samp=n(p.sampleCost), units=n(p.units), price=n(p.price);
  const mkt=n(p.mktAds)+n(p.mktInfluencer)+n(p.mktContent)+n(p.mktStall);
  const totalCost=bulk+samp+mkt;
  const revenue=(data.income||[]).filter(i=>i.productId===p.id).reduce((s,x)=>s+n(x.amount),0);
  const profit=revenue-totalCost;
  const breakEven=price>0?Math.ceil(totalCost/price):0;
  const profitPerUnit=units>0?(price-(totalCost/units)):0;
  return{bulk,samp,mkt,totalCost,revenue,profit,breakEven,profitPerUnit};
}

// ── MONTHLY MATH ──────────────────────────────────────────────────────────
function activeFixedCostsTotal(){ return data.fixedCosts.filter(f=>f.active!==false).reduce((s,f)=>s+n(f.amount),0); }
function monthIncome(ymStr){ return data.income.filter(i=>ym(i.date)===ymStr); }
function monthExpenses(ymStr){ return data.expenses.filter(e=>ym(e.date)===ymStr); }
function monthTotals(ymStr){
  const inc = monthIncome(ymStr), exp = monthExpenses(ymStr);
  const totalIncome = inc.reduce((s,i)=>s+n(i.amount),0);
  const loggedExpenses = exp.reduce((s,e)=>s+n(e.amount),0);
  const fixed = activeFixedCostsTotal();
  const totalExpenses = loggedExpenses + fixed;
  return { inc, exp, totalIncome, loggedExpenses, fixed, totalExpenses, net: totalIncome-totalExpenses };
}

// ── NAVIGATION SHELL ───────────────────────────────────────────────────────
const SECTIONS = [
  {group:'Overview', items:[ {id:'dashboard', label:'Overview', icon:'◈'} ]},
  {group:'Bookkeeping', items:[
    {id:'entries', label:'Income & Expenses', icon:'📒'},
    {id:'fixedcosts', label:'Fixed Costs', icon:'🏷️'},
    {id:'report', label:'Monthly Report', icon:'📊'}
  ]},
  {group:'Planning', items:[
    {id:'products', label:'Products', icon:'📦'},
    {id:'samples', label:'Samples & Bulk', icon:'🧵'},
    {id:'drops', label:'Drops & Budgets', icon:'🚀'}
  ]},
  {group:'', items:[
    {id:'files', label:'Files', icon:'📎'},
    {id:'taxguide', label:'Austria Tax Guide', icon:'🇦🇹'},
    {id:'settings', label:'Settings', icon:'⚙️'}
  ]}
];
const BOTTOM_NAV_IDS = ['dashboard','entries','products','report'];

function buildSidebar(){
  const sb = $('sidebar');
  let html = `<div class="sidebar-brand">◈ Brand Monetizer</div>`;
  SECTIONS.forEach(g=>{
    if(g.group) html += `<div class="sidebar-group-label">${g.group}</div>`;
    g.items.forEach(it=>{
      html += `<button class="sidebar-btn" data-nav="${it.id}" onclick="navigate('${it.id}')"><span class="nav-icon">${it.icon}</span>${it.label}</button>`;
    });
  });
  sb.innerHTML = html;
}

function baseView(view){
  const map = {'product-detail':'products','drop-detail':'drops','sample-detail':'samples'};
  return map[view]||view;
}

function navigate(view, extra){
  currentView = view;
  routeExtra = extra||null;
  const base = baseView(view);
  document.querySelectorAll('.nav-btn, .sidebar-btn').forEach(b=>b.classList.remove('active'));
  if(BOTTOM_NAV_IDS.includes(base)) $('nav-'+base).classList.add('active');
  else $('nav-more').classList.add('active');
  const sbBtn = document.querySelector('.sidebar-btn[data-nav="'+base+'"]');
  if(sbBtn) sbBtn.classList.add('active');
  render();
  const pg = $('main-page'); if(pg) pg.scrollTop = 0;
}

function openMoreMenu(){
  const items = SECTIONS.flatMap(g=>g.items).filter(it=>!BOTTOM_NAV_IDS.includes(it.id));
  $('sheet-content').innerHTML = `<div class="sheet-title">More</div>` + items.map(it=>`
    <button class="row-item" style="width:100%;border:1px solid var(--border);cursor:pointer;" onclick="closeSheetThen('${it.id}')">
      <div class="row-item-left"><div class="row-item-name">${it.icon} ${it.label}</div></div>
      <span style="color:var(--muted)">›</span>
    </button>`).join('');
  showSheet();
}
function closeSheetThen(view){ $('sheet-overlay').classList.add('hidden'); navigate(view); }

function render(){
  const views = {
    dashboard: renderDashboard,
    entries: renderEntries,
    fixedcosts: renderFixedCosts,
    products: renderProducts,
    'product-detail': renderProductDetail,
    samples: renderSamples,
    'sample-detail': renderSampleDetail,
    drops: renderDrops,
    'drop-detail': renderDropDetail,
    report: renderReport,
    files: renderFiles,
    taxguide: renderTaxGuide,
    settings: renderSettings
  };
  (views[currentView]||renderDashboard)();
}

function showSheet(){ $('sheet-overlay').classList.remove('hidden'); }
function closeSheet(e){ if(!e || e.target===$('sheet-overlay')) $('sheet-overlay').classList.add('hidden'); }

function openAddSheet(){
  const mode = window._sheetMode||'entry';
  if(mode==='entry') openAddEntry();
  else if(mode==='fixedcost') openAddFixedCost();
  else if(mode==='product') openAddProduct();
  else if(mode==='sample') openAddSample();
  else if(mode==='drop') openAddDrop();
  else if(mode==='file') openAddFile();
}

// ── DASHBOARD ─────────────────────────────────────────────────────────────
function renderDashboard(){
  $('page-title').textContent = data.meta.businessName || 'Overview';
  $('page-sub').textContent = "Here's how your brand is doing";
  $('top-action-btn').classList.add('hidden');

  const curMonth = isoToday().slice(0,7);
  const t = monthTotals(curMonth);
  const recent = [...data.income.map(i=>Object.assign({},i,{_type:'income'})), ...data.expenses.map(e=>Object.assign({},e,{_type:'expense'}))]
    .sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,6);

  $('page-content').innerHTML = `
    <div class="stat-grid">
      <div class="stat-card green"><div class="stat-label">${monthLabel(curMonth)} Income</div><div class="stat-value">${fmt(t.totalIncome)}</div></div>
      <div class="stat-card red"><div class="stat-label">${monthLabel(curMonth)} Expenses</div><div class="stat-value">${fmt(t.totalExpenses)}</div><div class="stat-sub">incl. ${fmt(t.fixed)} fixed costs</div></div>
      <div class="stat-card ${t.net>=0?'green':'red'}" style="grid-column:span 2;"><div class="stat-label">${t.net>=0?'Profit':'Loss'} So Far This Month</div><div class="stat-value">${fmt(t.net)}</div></div>
    </div>
    <div class="card">
      <div class="card-title">Quick Actions</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <button class="btn btn-outline btn-sm" style="width:100%;" onclick="quickAction('income')">+ Income</button>
        <button class="btn btn-outline btn-sm" style="width:100%;" onclick="quickAction('expense')">+ Expense</button>
        <button class="btn btn-outline btn-sm" style="width:100%;" onclick="navigate('report')">📊 Monthly Report</button>
        <button class="btn btn-outline btn-sm" style="width:100%;" onclick="navigate('drops')">🚀 Budget a Drop</button>
      </div>
    </div>
    <div class="card">
      <div class="section-head"><div class="card-title" style="margin-bottom:0;">Recent Activity</div><button class="btn btn-outline btn-sm" onclick="navigate('entries')">View all</button></div>
      ${recent.length===0?`<div style="text-align:center;padding:20px;color:var(--muted);font-size:13px;">No entries yet</div>`
      :recent.map(x=>`<div class="sale-row"><div><div style="font-size:14px;font-weight:600;">${esc(x.description)||esc(x.category)||(x._type==='income'?'Income':'Expense')}</div><div style="font-size:12px;color:var(--muted)">${fmtDate(x.date)}</div></div><span class="amount ${x._type==='income'?'green':'red'}">${x._type==='expense'?'-':'+'}${fmt(x.amount)}</span></div>`).join('')}
    </div>
  `;
}
function quickAction(type){
  navigate('entries');
  setTimeout(()=>{ window._sheetMode='entry'; openAddEntry(type); },50);
}

// ── INCOME & EXPENSES (unified log) ──────────────────────────────────────
function renderEntries(){
  $('page-title').textContent='Income & Expenses';
  $('page-sub').textContent='Log what came in and what went out';
  $('top-action-btn').textContent='+ Entry';
  $('top-action-btn').classList.remove('hidden');
  window._sheetMode='entry';
  window._entryFilter = window._entryFilter || {q:'', month:''};
  const f = window._entryFilter;

  let items = [...data.income.map(i=>Object.assign({},i,{_type:'income'})), ...data.expenses.map(e=>Object.assign({},e,{_type:'expense'}))];
  if(f.month) items = items.filter(x=>ym(x.date)===f.month);
  if(f.q){
    const q = f.q.toLowerCase();
    items = items.filter(x=>(x.description||'').toLowerCase().includes(q) || (x.category||'').toLowerCase().includes(q));
  }
  items.sort((a,b)=> a.date===b.date ? (b.ts||0)-(a.ts||0) : (a.date<b.date?1:-1));

  const totalIncome = items.filter(x=>x._type==='income').reduce((s,x)=>s+n(x.amount),0);
  const totalExpense = items.filter(x=>x._type==='expense').reduce((s,x)=>s+n(x.amount),0);

  $('page-content').innerHTML = `
    <div class="filter-bar">
      <input type="text" placeholder="Search..." value="${esc(f.q)}" oninput="setEntryFilter('q',this.value)"/>
      <input type="month" value="${f.month}" onchange="setEntryFilter('month',this.value)"/>
    </div>
    <div class="stat-grid">
      <div class="stat-card green"><div class="stat-label">Income</div><div class="stat-value">${fmt(totalIncome)}</div></div>
      <div class="stat-card red"><div class="stat-label">Expenses</div><div class="stat-value">${fmt(totalExpense)}</div></div>
    </div>
    ${items.length===0?`<div class="empty"><div class="empty-icon">📒</div><p>No entries yet.<br/>Tap + Entry to log income or an expense.</p></div>`
    :items.map(x=>{
      const drop = x.dropId ? data.drops.find(d=>d.id===x.dropId) : null;
      const prod = x.productId ? data.products.find(p=>p.id===x.productId) : null;
      return `<div class="row-item">
        <div class="row-item-left">
          <div class="row-item-name">${esc(x.description)||esc(x.category)||(x._type==='income'?'Income':'Expense')}</div>
          <div class="row-item-sub">${fmtDate(x.date)} · ${esc(x.category)||''}${prod?(' · '+esc(prod.name)+(x.units?(' × '+x.units):'')):''}${drop?(' · '+esc(drop.name)):''}</div>
        </div>
        <div class="row-item-right">
          <span class="amount ${x._type==='income'?'green':'red'}">${x._type==='expense'?'-':'+'}${fmt(x.amount)}</span>
          ${x.fileId?`<button class="del-btn" style="color:var(--text)" onclick="viewFile('${x.fileId}')" title="View receipt">📎</button>`:''}
          <button class="del-btn" onclick="deleteEntry('${x._type}','${x.id}')">✕</button>

function saveEntry(){
  const t = window._entryType;
  const amount = n($('e-amt').value); if(amount<=0){ alert('Enter an amount'); return; }
  const date = $('e-date').value || isoToday();
  const description = $('e-desc').value;
  const category = $('e-cat').value;
  const dropId = ($('e-drop') && $('e-drop').value) || null;
  const dropCategory = (dropId && $('e-dropcat')) ? ($('e-dropcat').value||null) : null;

  const buildAndPush = (fileId)=>{
    let rec;
    if(t==='income'){
      const productId = ($('e-product') && $('e-product').value) || null;
      const units = productId ? n($('e-units').value) : null;
      rec = {id:uid(), date, amount, description, category, productId, units, dropId, fileId:fileId||null, ts:Date.now()};
      data.income.push(rec);
    } else {
      rec = {id:uid(), date, amount, description, category, dropId, dropCategory, fileId:fileId||null, ts:Date.now()};
      data.expenses.push(rec);
    }
    save(); closeSheet(); toast((t==='income'?'Income':'Expense')+' added'); render();
    return rec;
  };
  const fInput = $('e-file'); const f = fInput && fInput.files[0];
  if(f){
    const fileRec = {id:uid(), name:f.name, note:description, size:f.size, type:f.type, date:today(), dateIso:date, ts:Date.now(), linkedType:t, linkedId:null, blob:f};
    dbPutFile(fileRec).then(()=>{
      const rec = buildAndPush(fileRec.id);
      fileRec.linkedId = rec.id; dbPutFile(fileRec).catch(()=>{});
    }).catch(()=>buildAndPush(null));
  } else {
    buildAndPush(null);
  }
}

function allCollections(){
  const set = new Set();
  data.samples.forEach(s=>{ if(s.collection) set.add(s.collection); });
  return Array.from(set).sort();
}
function verdictPill(v){
  if(v==='good') return `<span class="pill green">Good</span>`;
  if(v==='bad') return `<span class="pill red">Not Good</span>`;
  return `<span class="pill amber">Pending</span>`;
}
function bulkPill(s){
  const b = s.bulk||{};
  if(b.ordered) return `<span class="pill green">Bulk · ${n(b.qty)||0} pcs</span>`;
  return `<span class="pill amber">No Bulk Yet</span>`;
}
function latestRound(s){
  const r = s.rounds||[];
  return r.length ? r[r.length-1] : null;
}

  }
  items.sort((a,b)=>(b.ts||0)-(a.ts||0));

  const bulkOrderedCount = data.samples.filter(s=>s.bulk&&s.bulk.ordered).length;
  const totalSampleCost = data.samples.reduce((s,x)=>s+(x.rounds||[]).reduce((ss,r)=>ss+n(r.cost),0),0);
  const totalBulkCost = data.samples.reduce((s,x)=>s+((x.bulk&&x.bulk.ordered)?n(x.bulk.cost):0),0);
  const cols = allCollections();

  $('page-content').innerHTML = `

}
function deleteSample(id){

function setBulkOrdered(id, ordered){

function updateBulk(id, field, value){

function openAddRound(sampleId, roundId){
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const existing = roundId ? (s.rounds||[]).find(r=>r.id===roundId) : null;
  window._roundVerdict = existing ? existing.verdict : 'pending';
  renderRoundSheet(sampleId, roundId, existing);
  showSheet();
}
function setRoundVerdict(sampleId, roundId, v){
  window._roundVerdict = v;
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const existing = roundId ? (s.rounds||[]).find(r=>r.id===roundId) : null;
  renderRoundSheet(sampleId, roundId, existing);
}
function renderRoundSheet(sampleId, roundId, existing){
  const v = window._roundVerdict||'pending';

  `;

function saveRound(sampleId, roundId){
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  s.rounds = s.rounds||[];
  const rec = {
    id: roundId||uid(),
    orderDate: $('rd-order').value||isoToday(),
    sampleDate: $('rd-recv').value||'',
    verdict: window._roundVerdict||'pending',
    cost: $('rd-cost').value,
    notes: $('rd-notes').value
  };
  if(roundId){
    const idx = s.rounds.findIndex(r=>r.id===roundId);
    if(idx>-1) s.rounds[idx]=rec; else s.rounds.push(rec);
  } else {
    s.rounds.push(rec);
  }
  save(); closeSheet(); toast(roundId?'Round updated':'Round added'); navigate('sample-detail', sampleId);
}
function deleteRound(sampleId, roundId){
  if(!confirm('Delete this sample round?')) return;
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  s.rounds = (s.rounds||[]).filter(r=>r.id!==roundId);
  save(); toast('Round deleted'); navigate('sample-detail', sampleId);
}

      : lines.map(l=>{
        const actual = expenses.filter(e=>e.dropCategory===l.category).reduce((s,e)=>s+n(e.amount),0);
        const pct = n(l.planned)>0?Math.min(100,actual/n(l.planned)*100):0;
        const over = actual>n(l.planned);
        const color = pct<70?'var(--green)':pct<90?'var(--amber)':'var(--red)';
        return `<div style="margin-bottom:14px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;align-items:center;">

            <div style="display:flex;align-items:center;gap:8px;">
              <span style="font-size:12px;color:${over?'var(--red)':'var(--muted)'};">${fmt(actual)} / ${fmt(l.planned)}</span>
              <button class="del-btn" style="min-width:24px;min-height:24px;font-size:14px;" onclick="deleteBudgetLine('${d.id}','${l.id}')">✕</button>

        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <div class="card-title">Linked Income &amp; Expenses</div>
      ${linked.length===0?`<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">Nothing linked yet — choose this drop when logging an entry in Income &amp; Expenses.</div>`

function renderReport(){
  $('page-title').textContent='Monthly Report';
  $('page-sub').textContent='See exactly how the month went';
  $('top-action-btn').classList.add('hidden');
  window._reportMonth = window._reportMonth || isoToday().slice(0,7);
  const mt = window._reportMonth;
  const t = monthTotals(mt);

  const salesByProduct = {};
  t.inc.forEach(i=>{
    if(!i.productId) return;
    salesByProduct[i.productId] = salesByProduct[i.productId] || {units:0, revenue:0};
    salesByProduct[i.productId].units += n(i.units);
    salesByProduct[i.productId].revenue += n(i.amount);
  });
  const productRows = Object.keys(salesByProduct).map(pid=>{
    const product = data.products.find(p=>p.id===pid);
    return product ? Object.assign({product}, salesByProduct[pid]) : null;
  }).filter(Boolean).sort((a,b)=>b.revenue-a.revenue);
  const totalUnits = productRows.reduce((s,r)=>s+r.units,0);
  const bestSeller = productRows[0];

  const expByCat = {};
  t.exp.forEach(e=>{ const c=e.category||'Other'; expByCat[c]=(expByCat[c]||0)+n(e.amount); });
  if(t.fixed>0) expByCat['Fixed Costs'] = (expByCat['Fixed Costs']||0)+t.fixed;
  const expRows = Object.entries(expByCat).map(([cat,amt])=>({cat,amt})).sort((a,b)=>b.amt-a.amt);

  const allEntries = [...t.inc.map(i=>Object.assign({},i,{_type:'income'})), ...t.exp.map(e=>Object.assign({},e,{_type:'expense'}))].sort((a,b)=>a.date<b.date?1:-1);

  $('page-content').innerHTML = `
    <div class="filter-bar"><input type="month" value="${mt}" onchange="setReportMonth(this.value)"/></div>
    <div style="text-align:center;margin-bottom:16px;"><span style="font-family:var(--serif);font-size:20px;font-weight:700;">${monthLabel(mt)}</span></div>
    <div class="stat-grid">
      <div class="stat-card green"><div class="stat-label">Income</div><div class="stat-value">${fmt(t.totalIncome)}</div></div>
      <div class="stat-card red"><div class="stat-label">Expenses</div><div class="stat-value">${fmt(t.totalExpenses)}</div></div>
      <div class="stat-card ${t.net>=0?'green':'red'}" style="grid-column:span 2;"><div class="stat-label">${t.net>=0?'Profit':'Loss'}</div><div class="stat-value">${fmt(t.net)}</div><div class="stat-sub">${t.net>=0?'You made a profit this month 🎉':'You made a loss this month'}</div></div>
    </div>

    <div class="card">
      <div class="card-title">Products Sold</div>
      ${productRows.length===0?`<div style="text-align:center;padding:12px;color:var(--muted);font-size:13px;">No product sales linked this month</div>`:`
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
        <span style="font-size:13px;color:var(--muted);">Total pieces sold</span><span style="font-weight:700;">${totalUnits}</span>
      </div>
      ${bestSeller?`<div style="font-size:13px;color:var(--muted);margin-bottom:10px;">Best seller: <b style="color:var(--text)">${esc(bestSeller.product.name)}</b> (${bestSeller.units} sold, ${fmt(bestSeller.revenue)})</div>`:''}
      ${productRows.map(r=>`<div class="sale-row"><div><div style="font-size:14px;font-weight:600;">${esc(r.product.name)}</div><div style="font-size:12px;color:var(--muted)">${r.units} units</div></div><span class="amount green">${fmt(r.revenue)}</span></div>`).join('')}
      `}
    </div>

    <div class="card">
      <div class="card-title">Where the Money Went</div>
      ${expRows.length===0?`<div style="text-align:center;padding:12px;color:var(--muted);font-size:13px;">No expenses this month</div>`
      :expRows.map(r=>`
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:14px;"><span>${esc(r.cat)}</span><span style="font-weight:600;">${fmt(r.amt)}</span></div>
        <div class="progress-wrap" style="margin-bottom:12px;"><div class="progress-bar" style="width:${t.totalExpenses>0?r.amt/t.totalExpenses*100:0}%;background:var(--dark);"></div></div>
      `).join('')}
    </div>

    <div class="card">
      <div class="section-head"><div class="card-title" style="margin-bottom:0;">All Entries This Month</div><button class="btn btn-outline btn-sm" onclick="viewMonthInLog('${mt}')">View in log</button></div>
      ${allEntries.length===0?`<div style="text-align:center;padding:16px;color:var(--muted);font-size:13px;">Nothing logged this month yet</div>`
      :allEntries.map(x=>`
        <div class="sale-row">
          <div><div style="font-size:14px;font-weight:600;">${esc(x.description)||esc(x.category)}</div><div style="font-size:12px;color:var(--muted)">${fmtDate(x.date)} · ${esc(x.category)||''}</div></div>
          <div style="display:flex;align-items:center;gap:8px;">
            ${x.fileId?`<button class="del-btn" style="color:var(--text)" onclick="viewFile('${x.fileId}')">📎</button>`:''}
            <span class="amount ${x._type==='income'?'green':'red'}">${x._type==='expense'?'-':'+'}${fmt(x.amount)}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}
function setReportMonth(v){ window._reportMonth=v; renderReport(); }
function viewMonthInLog(mt){
  window._entryFilter = {q:'', month:mt};
  navigate('entries');
}

// ── FILES ─────────────────────────────────────────────────────────────────
function linkedLabel(f){
  if(f.linkedType==='income'){ const i=data.income.find(x=>x.id===f.linkedId); return i?('linked to "'+(i.description||i.category||'income')+'"'):''; }
  if(f.linkedType==='expense'){ const e=data.expenses.find(x=>x.id===f.linkedId); return e?('linked to "'+(e.description||e.category||'expense')+'"'):''; }
  return '';
}
function renderFiles(){
  $('page-title').textContent='Files';
  $('page-sub').textContent='Receipts & documents, organized by month';
  $('top-action-btn').textContent='+ Upload';
  $('top-action-btn').classList.remove('hidden');
  window._sheetMode='file';
  window._filesMonth = window._filesMonth===undefined ? '' : window._filesMonth;
  const content = $('page-content');
  content.innerHTML = `<div class="empty"><div class="empty-icon">⏳</div><p>Loading files…</p></div>`;
  dbGetAllFiles().then(files=>{
    if(currentView!=='files') return;
    let list = files;
    if(window._filesMonth) list = list.filter(f=>(f.dateIso||'').slice(0,7)===window._filesMonth);
    list.sort((a,b)=>(b.ts||0)-(a.ts||0));
    const filterBar = `<div class="filter-bar"><input type="month" value="${window._filesMonth}" onchange="setFilesMonth(this.value)"/></div>`;
    content.innerHTML = filterBar + (list.length===0?`
      <div class="empty"><div class="empty-icon">📎</div><p>No files yet.<br/>Tap + Upload to add receipts, invoices, or any document.</p></div>
    `:list.map(f=>{
      const icon = f.type && f.type.indexOf('image/')===0 ? '🖼️' : (f.type==='application/pdf' ? '📄' : '📎');
      const link = linkedLabel(f);
      return `<div class="row-item">
        <div class="row-item-left" style="cursor:pointer;" onclick="viewFile('${f.id}')">
          <div class="row-item-name">${icon} ${esc(f.name)}</div>
          <div class="row-item-sub">${fmtSize(f.size)} · ${f.date}${link?(' · '+link):''}${f.note?(' · '+esc(f.note)):''}</div>
        </div>
        <div class="row-item-right"><button class="del-btn" onclick="deleteFile('${f.id}')">✕</button></div>
      </div>`;
    }).join(''));
  }).catch(err=>{
    if(currentView!=='files') return;
    content.innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><p>Couldn't open file storage in this browser.<br/>${esc((err&&err.message)||'')}</p></div>`;
  });
}
function setFilesMonth(v){ window._filesMonth=v; renderFiles(); }
function openAddFile(){
  $('sheet-content').innerHTML = `
    <div class="sheet-title">Upload File</div>
    <div class="field"><label class="field-label">Choose File</label><div class="input-wrap"><input id="s-file" type="file"/></div></div>
    <div class="field"><label class="field-label">Name (optional)</label><div class="input-wrap"><input id="s-fname" type="text" placeholder="e.g. Supplier Invoice #204"/></div></div>
    <div class="field" style="margin-bottom:0"><label class="field-label">Note (optional)</label><div class="input-wrap"><input id="s-fnote" type="text" placeholder="Any details..."/></div></div>
    <button class="btn btn-dark" style="margin-top:14px;" onclick="saveNewFile()">Upload</button>
  `;
  showSheet();
}
function saveNewFile(){
  const input = $('s-file'); const f = input && input.files[0];
  if(!f){ alert('Choose a file first'); return; }
  const rec = {id:uid(), name:$('s-fname').value||f.name, note:$('s-fnote').value, size:f.size, type:f.type, date:today(), dateIso:isoToday(), ts:Date.now(), linkedType:null, linkedId:null, blob:f};
  dbPutFile(rec).then(()=>{ closeSheet(); toast('File saved'); renderFiles(); }).catch(e=>alert('Could not save file: '+e.message));
}
function viewFile(id){
  dbGetFile(id).then(rec=>{
    if(!rec){ alert('File not found'); return; }
    const url = URL.createObjectURL(rec.blob);
    window.open(url, '_blank');
  }).catch(()=>alert('Could not open file'));
}
function deleteFile(id){
  if(!confirm('Delete this file?')) return;
  dbDeleteFile(id).catch(()=>{}).then(()=>{ toast('File deleted'); renderFiles(); });
}

// ── AUSTRIA / VIENNA TAX GUIDE ───────────────────────────────────────────
function renderTaxGuide(){
  $('page-title').textContent='Austria Tax Guide';
  $('page-sub').textContent='Plain-language basics for a small business in Vienna';
  $('top-action-btn').classList.add('hidden');
  $('page-content').innerHTML = `
    <div class="callout"><b>This is general education, not tax advice.</b> Thresholds and rates below are the 2026 figures and are adjusted almost every year. Always confirm your specific situation with the <b>WKO Gründerservice</b> (wko.at) or a <b>Steuerberater</b> (tax advisor) before making decisions.</div>

    <div class="card doc-section">
      <h3>The Big Picture</h3>
      <p>Running a small clothing brand in Austria, you generally deal with up to three separate things: <b>Umsatzsteuer</b> (VAT, on sales), <b>Einkommensteuer</b> (income tax, on your profit), and <b>Sozialversicherung / SVS</b> (social insurance for the self-employed). Whether each one applies — and how much it costs — depends mostly on how much you earn.</p>
    </div>

    <div class="card doc-section">
      <h3>1. Kleinunternehmerregelung — the small business VAT exemption</h3>
      <p>If your <b>yearly revenue stays under €55,000</b> (2026), you can register as a "Kleinunternehmer." That means:</p>
      <ul>
        <li>You don't charge VAT (Umsatzsteuer) on what you sell, and don't file VAT returns.</li>
        <li>In exchange, you also can't reclaim VAT (Vorsteuer) on what you buy for the business.</li>
        <li>There's a 10% buffer — going up to €60,500 in one year doesn't lose you the exemption for that year, but you can't use it again the following year.</li>
      </ul>
      <p>Most brand-new, small clothing brands start out as Kleinunternehmer — it's simpler, but only worth it if you're not buying huge amounts of VAT-heavy stock (fabric, printing, bulk production) that you'd otherwise reclaim VAT on.</p>
    </div>

    <div class="card doc-section">
      <h3>2. Umsatzsteuer (VAT) — once you're over the threshold</h3>
      <p>Once your revenue crosses €55,000, you generally must charge <b>20% VAT</b> (the standard Austrian rate — clothing isn't reduced-rate) on your sales, file regular VAT returns, and pay the difference between VAT collected and VAT you paid on business purchases to the tax office.</p>
    </div>

    <div class="card doc-section">
      <h3>3. Einkommensteuer (Income Tax) — on your profit, not your revenue</h3>
      <p>This is calculated on what's <b>left after expenses</b> (income − expenses), once a year. Austria's system is progressive — you only pay the higher rate on the slice of profit inside that bracket, not your whole profit. 2026 brackets:</p>
      <ul>
        <li>Up to €13,539 — <b>0%</b> (tax-free)</li>
        <li>€13,539 – €21,992 — <b>20%</b></li>
        <li>€21,992 – €36,458 — <b>30%</b></li>
        <li>€36,458 – €70,365 — <b>40%</b></li>
        <li>€70,365 – €104,859 — <b>48%</b></li>
        <li>€104,859 – €1,000,000 — <b>50%</b></li>
        <li>above €1,000,000 — <b>55%</b></li>
      </ul>
      <p>Filed via your annual Steuererklärung (roughly due end of April on paper / end of June via FinanzOnline — a Steuerberater can usually get you an extension).</p>
    </div>

    <div class="card doc-section">
      <h3>4. Sozialversicherung (SVS) — often the cost people forget</h3>
      <p>As a self-employed person you pay your own health, pension and accident insurance through the <b>SVS</b>. If your yearly profit stays <b>under €6,613.20</b> (2026), you're generally exempt from mandatory SVS contributions — you only owe a small flat accident-insurance fee (€155.40/year). Above that threshold, SVS becomes mandatory and typically runs <b>around a quarter of your profit</b> — this is the number that catches most new small-business owners off guard, so budget for it.</p>
    </div>

    <div class="card doc-section">
      <h3>5. Do you need a Gewerbeschein?</h3>
      <p>Selling clothing as a business — even online or at pop-ups — generally counts as a "Handelsgewerbe" (trade) in Austria and needs a trade license (Gewerbeschein) registered with your local Bezirkshauptmannschaft / the WKO. This is separate from — and usually a prerequisite to — your tax registration.</p>
    </div>

    <div class="card doc-section">
      <h3>6. Keep every receipt (Belege)</h3>
      <p>Austrian law requires you to keep business receipts and invoices for <b>7 years</b> (Aufbewahrungspflicht). This is exactly what the <b>Files</b> tab in this app is for — attach every receipt to its expense as you go, so you're never scrambling to find one later.</p>
    </div>

    <div class="callout info">
      <b>Rough rule of thumb:</b><br/>
      Under ~€6,600 profit/year → basically no income tax, no mandatory SVS.<br/>
      €6,600–€55,000 revenue → SVS becomes mandatory (~25% of profit), income tax kicks in above €13,539 profit, still VAT-free if you stay a Kleinunternehmer.<br/>
      Above €55,000 revenue → VAT (20%) applies too, on top of full income tax and SVS.
    </div>
    <div class="callout">Figures sourced from FreeFinance, GCT, facturo, getaccounted, kalkuel, Geroldinger, Raisin, USP.gv.at, finanz.at, Arbeiterkammer, and SVS.at (2026 values). Verify current numbers at <b>wko.at</b>, <b>usp.gv.at</b>, or <b>svs.at</b> before relying on them.</div>
  `;
}

// ── SETTINGS ──────────────────────────────────────────────────────────────
function renderSettings(){
  $('page-title').textContent='Settings';
  $('page-sub').textContent='Business info & backups';
  $('top-action-btn').classList.add('hidden');
  $('page-content').innerHTML = `
    <div class="card">
      <div class="card-title">Business Info</div>
      <div class="field" style="margin-bottom:0"><label class="field-label">Business Name</label><div class="input-wrap"><input id="set-name" type="text" value="${esc(data.meta.businessName||'')}" oninput="updateMeta('businessName',this.value)"/></div></div>
    </div>
    <div class="card">
      <div class="card-title">Backup Your Data</div>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="exportData()">⬇ Export backup</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="$('import-file-input').click()">⬆ Import backup</button>
      </div>
      <input type="file" id="import-file-input" accept="application/json,.json" style="display:none" onchange="importData(this.files[0])"/>
      <div style="font-size:11px;color:var(--muted);margin-top:10px;line-height:1.5;">Everything auto-saves on this device as you go. Export a backup regularly, or before switching devices/browsers. Uploaded files live in the Files tab and stay on this device.</div>
    </div>
    <div class="danger-zone">
      <div style="font-weight:700;font-size:13px;color:var(--red);margin-bottom:8px;">Danger Zone</div>
      <div style="font-size:12px;color:var(--red);margin-bottom:12px;">Permanently erase all bookkeeping data on this device. This cannot be undone.</div>
      <button class="btn btn-red" onclick="eraseAllData()">Erase All Data</button>
    </div>
  `;
}
function updateMeta(field,val){ data.meta[field]=val; save(); }
function eraseAllData(){
  const sure = prompt('Type DELETE to permanently erase all data on this device:');
  if(sure!=='DELETE') return;
  data = defaultData();
  save();
  dbGetAllFiles().then(files=>Promise.all(files.map(f=>dbDeleteFile(f.id)))).catch(()=>{});
  toast('All data erased');
  navigate('dashboard');
}
function exportData(){
  const payload = Object.assign({}, data, {exportedAt:new Date().toISOString(), version:5});
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download='brand-monetizer-backup-'+isoToday()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  toast('Backup downloaded');
}
function importData(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(d.income || d.expenses){
        if(!confirm('Import will replace ALL current data on this device. Continue?')) return;
        data = {
          meta: d.meta || defaultData().meta,
          income: Array.isArray(d.income)?d.income:[],
          expenses: Array.isArray(d.expenses)?d.expenses:[],
          fixedCosts: Array.isArray(d.fixedCosts)?d.fixedCosts:[],
          products: Array.isArray(d.products)?d.products:[],
          drops: Array.isArray(d.drops)?d.drops:[]
        };
        save(); toast('Data imported'); navigate('dashboard');
      } else if(d.entries){
        if(!confirm('This looks like an older backup. Import and convert it? This replaces all current data on this device.')) return;
        migrateFromV4(d); toast('Older backup imported and converted'); navigate('dashboard');
      } else if(d.products){
        if(!confirm('This looks like an older backup. Import and convert it? This replaces all current data on this device.')) return;
        migrateFromV3(d); toast('Older backup imported and converted'); navigate('dashboard');
      } else {
        alert("This file doesn't look like a Brand Monetizer backup.");
      }
    }catch(e){ alert('That file could not be read as a backup.'); }
  };
  reader.readAsText(file);
}

// ── INIT ──────────────────────────────────────────────────────────────────
load();
buildSidebar();
navigate('dashboard');
if(window._migrated) setTimeout(()=>toast('Imported your previous data'), 400);
</script>
