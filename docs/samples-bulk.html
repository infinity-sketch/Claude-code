<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="Samples"/>
<meta name="theme-color" content="#0a0a0a"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>Samples &amp; Bulk</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
:root{
  --bg:#f5f4f0;--card:#ffffff;--border:#e8e6e0;--text:#0a0a0a;--muted:#a0998a;
  --dark:#0a0a0a;--dark-fg:#ffffff;--green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;--amber:#d97706;--amber-bg:#fffbeb;
  --r:18px;--font:'DM Sans',sans-serif;--serif:'Playfair Display',serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171510;--card:#221f19;--border:#3a3428;--text:#f2ede2;--muted:#9c9284;
    --dark:#f2ede2;--dark-fg:#171510;--green:#4ade80;--green-bg:#122c1c;
    --red:#f87171;--red-bg:#3f1d1d;--red-border:#5c2b2b;--amber:#fbbf24;--amber-bg:#3f2e0c;
  }
}
:root[data-theme="dark"]{
  --bg:#171510;--card:#221f19;--border:#3a3428;--text:#f2ede2;--muted:#9c9284;
  --dark:#f2ede2;--dark-fg:#171510;--green:#4ade80;--green-bg:#122c1c;
  --red:#f87171;--red-bg:#3f1d1d;--red-border:#5c2b2b;--amber:#fbbf24;--amber-bg:#3f2e0c;
}
html,body{min-height:100%;background:var(--bg);font-family:var(--font);color:var(--text);}
.wrap{max-width:640px;margin:0 auto;padding:0 0 80px;}
.topbar{padding:32px 20px 16px;background:var(--bg);display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--border);gap:10px;position:sticky;top:0;z-index:10;}
.topbar-left h1{font-family:var(--serif);font-size:24px;font-weight:900;letter-spacing:-0.03em;line-height:1.1;}
.topbar-left p{font-size:12px;color:var(--muted);margin-top:4px;}
.top-action{background:var(--dark);color:var(--dark-fg);border:none;border-radius:50px;padding:10px 18px;font-size:13px;font-weight:600;font-family:var(--font);cursor:pointer;white-space:nowrap;min-height:44px;display:flex;align-items:center;flex-shrink:0;}
.top-action.hidden{display:none;}

.page-inner{padding:16px 20px 24px;}
@media (min-width:640px){ .page-inner{padding:24px 0; } .topbar{padding:32px 0 16px;} }

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:14px;}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;}
.stat-card.red{background:var(--red-bg);border-color:var(--red-border);}
.stat-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;}
.stat-value{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1;color:var(--text);}
.stat-card.red .stat-value{color:var(--red);}

.field{margin-bottom:14px;}
.field-label{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px;display:block;}
.input-wrap{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.15s;}
.input-wrap:focus-within{border-color:var(--dark);}
.input-suffix{padding:0 12px;font-size:15px;color:var(--muted);font-weight:500;}
.input-wrap input[type=text],.input-wrap input[type=number],.input-wrap input[type=date]{flex:1;border:none;background:transparent;padding:14px 14px;font-size:15px;color:var(--text);font-family:var(--font);outline:none;min-height:48px;min-width:0;}
.input-wrap input[type=file]{flex:1;padding:12px 14px;font-size:13px;font-family:var(--font);color:var(--text);}
.input-wrap input::placeholder{color:#ccc;}
select{width:100%;border:1.5px solid var(--border);border-radius:12px;padding:14px;font-size:15px;color:var(--text);font-family:var(--font);background:var(--bg);outline:none;min-height:48px;-webkit-appearance:none;appearance:none;}
.date-parts{display:flex;gap:6px;}
.date-parts select{padding:10px 4px;font-size:13.5px;min-height:44px;text-align:center;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:14px;padding:15px 20px;font-size:15px;font-weight:600;font-family:var(--font);cursor:pointer;min-height:52px;width:100%;transition:opacity 0.15s,transform 0.1s;}
.btn:active{opacity:0.85;transform:scale(0.98);}
.btn:disabled{opacity:0.5;cursor:default;}
.btn-dark{background:var(--dark);color:#fff;}
.btn-outline{background:transparent;color:var(--text);border:1.5px solid var(--border);}
.btn-red{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red-border);}
.btn-sm{min-height:38px;padding:8px 14px;font-size:13px;border-radius:10px;width:auto;}

.row-item{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;gap:10px;}
.row-item-left{flex:1;min-width:0;}
.row-item-name{font-size:14px;font-weight:600;color:var(--text);}
.row-item-sub{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row-item-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.amount{font-size:15px;font-weight:700;}

.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:50px;font-size:11px;font-weight:600;}
.pill.green{background:var(--green-bg);color:var(--green);}
.pill.red{background:var(--red-bg);color:var(--red);}
.pill.amber{background:var(--amber-bg);color:var(--amber);}

.divider{height:1px;background:var(--border);margin:14px 0;}
.del-btn{background:none;border:none;color:#ccc;font-size:18px;cursor:pointer;padding:6px;min-width:32px;min-height:32px;display:flex;align-items:center;justify-content:center;}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
.sheet-overlay.hidden{display:none;}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:460px;padding:20px 20px calc(28px + env(safe-area-inset-bottom, 12px));max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 18px;}
.sheet-title{font-family:var(--serif);font-size:22px;font-weight:700;margin-bottom:18px;}

.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty p{font-size:14px;}

.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px;}
.section-head h2{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;}

.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;font-size:14px;color:var(--muted);font-family:var(--font);cursor:pointer;padding:0;margin-bottom:16px;}

.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.filter-bar input[type=text]{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:13px;font-family:var(--font);background:var(--card);outline:none;flex:1;min-width:130px;}

.type-tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:16px;}
.type-tab{flex:1;padding:9px 4px;border:none;background:none;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--muted);font-family:var(--font);cursor:pointer;}
.type-tab.active{background:var(--dark);color:#fff;}

.avatar{border-radius:14px;overflow:hidden;background:var(--bg);border:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.avatar-lg{width:64px;height:64px;font-size:24px;color:var(--muted);}
.avatar-sm{width:44px;height:44px;font-size:16px;color:var(--muted);border-radius:10px;}

.hidden-file-input{display:none;}

.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-tile{position:relative;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--border);cursor:pointer;}
.photo-tile img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.photo-note{font-size:10.5px;color:var(--muted);padding:5px 6px 7px;line-height:1.3;max-height:2.6em;overflow:hidden;}
.photo-tile .ph-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.55);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.muted-note{font-size:12.5px;color:var(--muted);text-align:center;padding:10px 4px;line-height:1.5;}
.storage-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:6px;}

#sb-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:9px 18px;border-radius:50px;font-size:12px;font-family:var(--font);font-weight:500;z-index:500;opacity:0;transition:opacity 0.25s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="topbar-left">
      <h1 id="page-title">Samples &amp; Bulk</h1>
      <p id="page-sub">Track manufacturer samples and bulk orders</p>
    </div>
    <button class="top-action hidden" id="top-action-btn" onclick="openAddTop()">+ Sample</button>
  </div>
  <div class="page-inner" id="page-content"><div class="empty"><div class="empty-icon">⏳</div><p>Loading…</p></div></div>
</div>

<div class="sheet-overlay hidden" id="sheet-overlay" onclick="closeSheet(event)">
  <div class="sheet" id="sheet"><div class="sheet-handle"></div><div id="sheet-content"></div></div>
</div>

<script>
// ── STORAGE BACKEND ────────────────────────────────────────────────────────
// Primary: the Artifact "db" + "assets" capabilities (synced to your Claude
// account, no size limits worth worrying about for this use case). Falls
// back to plain browser localStorage (text data only, no file uploads) when
// this page is opened outside the Claude Artifact runtime.
const LOCAL_KEY = 'samples_bulk_pipeline_v1';
let db = null, assetsApi = null;
let data = { samples: [], bulkOrders: [] };
let currentView = 'list';
let routeExtra = null;

async function initCapabilities(){
  try{
    if(window.claude && typeof window.claude.use==='function'){
      db = await window.claude.use('db');
      assetsApi = await window.claude.use('assets');
    }
  }catch(e){}
}
function loadLocal(){
  try{
    const raw = localStorage.getItem(LOCAL_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data.samples = Array.isArray(parsed.samples) ? parsed.samples : [];
      data.bulkOrders = Array.isArray(parsed.bulkOrders) ? parsed.bulkOrders : [];
    }
  }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); }catch(e){} }

async function loadData(){
  if(db){
    try{
      const [sSnap, bSnap] = await Promise.all([db.collection('samples').get(), db.collection('bulkOrders').get()]);
      data.samples = sSnap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      data.bulkOrders = bSnap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      return;
    }catch(e){}
  }
  loadLocal();
}
async function persistSample(s){
  if(db){
    try{ await db.collection('samples').doc(s.id).set(JSON.parse(JSON.stringify(s))); return; }
    catch(e){ toast('Save failed — check connection'); }
  }
  saveLocal();
}
async function persistDeleteSample(id){
  if(db){
    try{ await db.collection('samples').doc(id).delete(); return; }
    catch(e){ toast('Delete failed'); }
  }
  saveLocal();
}
async function persistBulkOrder(b){
  if(db){
    try{ await db.collection('bulkOrders').doc(b.id).set(JSON.parse(JSON.stringify(b))); return; }
    catch(e){ toast('Save failed — check connection'); }
  }
  saveLocal();
}
async function persistDeleteBulkOrder(id){
  if(db){
    try{ await db.collection('bulkOrders').doc(id).delete(); return; }
    catch(e){ toast('Delete failed'); }
  }
  saveLocal();
}
// One-time migration: bulk info used to live nested inside a sample
// (sample.bulk). Lift any of that into its own standalone bulkOrders entry
// so bulk orders can be added independently of a sample.
async function migrateLegacyBulk(){
  const withBulk = data.samples.filter(s=>s.bulk!==undefined);
  if(withBulk.length===0) return;
  for(const s of withBulk){
    const b0 = s.bulk||{};
    if(b0.ordered || b0.qty || b0.cost || b0.notes || b0.orderDate){
      const b = {id:uid(), name:s.name, manufacturer:s.manufacturer, collection:s.collection, ordered:!!b0.ordered, orderDate:b0.orderDate||'', qty:b0.qty||'', cost:b0.cost||'', notes:b0.notes||'', ts:Date.now()};
      data.bulkOrders.push(b);
      await persistBulkOrder(b);
    }
    delete s.bulk;
    await persistSample(s);
  }
}
function blobUrl(assetId){ return assetId ? ('/_blob/'+assetId) : ''; }
function filesAvailable(){ return !!assetsApi; }
async function deleteAsset(assetId){
  if(!assetsApi || !assetId) return;
  try{ await assetsApi.delete(assetId); }catch(e){}
}
function friendlyUploadError(err){
  const code = err && err.code;
  if(code==='too_large') return 'File is too large (max 20 MB).';
  if(code==='unsupported_type') return 'Unsupported file type. Use JPG, PNG, GIF, WebP or PDF.';
  if(code==='quota_or_state') return 'Storage is full — delete some old files first.';
  if(code==='rate_limited') return 'Too many uploads at once — wait a moment and try again.';
  if(code==='not_granted') return 'File uploads need this page opened as your Claude artifact.';
  return 'Could not upload the file. Please try again.';
}

// ── HELPERS ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const n = v => parseFloat(v)||0;
const fmt = v => n(v).toLocaleString('de-AT', {style:'currency', currency:'EUR'});
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const isoToday = () => new Date().toISOString().slice(0,10);
function fmtDateShort(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function fmtSize(bytes){ bytes=bytes||0; if(bytes<1024) return bytes+' B'; if(bytes<1024*1024) return (bytes/1024).toFixed(1)+' KB'; return (bytes/1024/1024).toFixed(1)+' MB'; }
let toastTimer;
function toast(msg, ms){
  let t = $('sb-toast');
  if(!t){ t=document.createElement('div'); t.id='sb-toast'; document.body.appendChild(t); }
  t.textContent = '✓ '+msg;
  t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.opacity='0'; }, ms||1600);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// Artifacts run in a sandboxed iframe where native confirm()/alert() dialogs
// are unreliable (often silently no-op), so deletions get their own sheet.
function confirmSheet(message, onYes, confirmLabel){
  $('sheet-content').innerHTML = `
    <div class="sheet-title">Are you sure?</div>
    <p style="font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:18px;">${esc(message)}</p>
    <button class="btn btn-red" onclick="window._confirmYes()">${esc(confirmLabel||'Delete')}</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="closeSheet()">Cancel</button>
  `;
  window._confirmYes = function(){ closeSheet(); onYes(); };
  showSheet();
}

// Plain day/month/year selects instead of a native <input type=date> — the
// iframe sandbox can make the native picker unreliable, selects always work.
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dateSelectHtml(prefix, iso, onchangeAttr){
  const parts = (iso||'').split('-');
  const y = parts[0]?parseInt(parts[0],10):'', m = parts[1]?parseInt(parts[1],10):'', d = parts[2]?parseInt(parts[2],10):'';
  const curYear = new Date().getFullYear();
  const years = []; for(let yy=curYear-3; yy<=curYear+3; yy++) years.push(yy);
  const days = []; for(let dd=1; dd<=31; dd++) days.push(dd);
  const chg = onchangeAttr||'';
  return `<div class="date-parts">
    <select id="${prefix}-d" ${chg}><option value="">Day</option>${days.map(dd=>`<option value="${dd}" ${dd===d?'selected':''}>${dd}</option>`).join('')}</select>
    <select id="${prefix}-m" ${chg}><option value="">Month</option>${MONTH_NAMES.map((mm,i)=>`<option value="${i+1}" ${(i+1)===m?'selected':''}>${mm}</option>`).join('')}</select>
    <select id="${prefix}-y" ${chg}><option value="">Year</option>${years.map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
  </div>`;
}
function readDateSelect(prefix){
  const d = $(prefix+'-d') ? $(prefix+'-d').value : '';
  const m = $(prefix+'-m') ? $(prefix+'-m').value : '';
  const y = $(prefix+'-y') ? $(prefix+'-y').value : '';
  if(!d||!m||!y) return '';
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

function navigate(view, extra){
  currentView = view;
  routeExtra = extra||null;
  render();
  window.scrollTo(0,0);
}
function render(){
  if(currentView==='detail') renderSampleDetail();
  else if(currentView==='bulk-detail') renderBulkDetail();
  else renderList();
}
function setSection(s){ window._section = s; navigate('list'); }
function openAddTop(){ if(window._section==='bulk') openAddBulkOrder(); else openAddSample(); }
function sectionTabsHtml(){
  window._section = window._section || 'samples';
  return `<div class="type-tabs">
    <button class="type-tab ${window._section==='samples'?'active':''}" onclick="setSection('samples')">Samples</button>
    <button class="type-tab ${window._section==='bulk'?'active':''}" onclick="setSection('bulk')">Bulk</button>
  </div>`;
}
function renderList(){
  window._section = window._section || 'samples';
  if(window._section==='bulk') renderBulkList(); else renderSamplesList();
}
function showSheet(){ $('sheet-overlay').classList.remove('hidden'); }
function closeSheet(e){ if(!e || e.target===$('sheet-overlay')) $('sheet-overlay').classList.add('hidden'); }

// ── SAMPLES & BULK ─────────────────────────────────────────────────────────
function allCollections(){
  const set = new Set();
  data.samples.forEach(s=>{ if(s.collection) set.add(s.collection); });
  data.bulkOrders.forEach(b=>{ if(b.collection) set.add(b.collection); });
  return Array.from(set).sort();
}
function verdictPill(v){
  if(v==='good') return `<span class="pill green">Good</span>`;
  if(v==='bad') return `<span class="pill red">Not Good</span>`;
  return `<span class="pill amber">Pending</span>`;
}
function latestRound(s){
  const r = s.rounds||[];
  return r.length ? r[r.length-1] : null;
}
function avatarHtml(assetId, size, fallbackIcon){
  const cls = size==='lg' ? 'avatar avatar-lg' : 'avatar avatar-sm';
  if(assetId) return `<div class="${cls}"><img src="${blobUrl(assetId)}"/></div>`;
  return `<div class="${cls}"><span>${fallbackIcon}</span></div>`;
}
function storageNoteHtml(){
  return `<div class="storage-note">${db?'☁️ Synced &amp; saved automatically to your Claude account':'💾 Saved in this browser only — open via your Claude artifact link for photo/file uploads and account sync'}</div>`;
}

function renderSamplesList(){
  $('page-title').textContent='Samples';
  $('page-sub').textContent=`${data.samples.length} item${data.samples.length!==1?'s':''}`;
  $('top-action-btn').textContent='+ Sample';
  $('top-action-btn').classList.remove('hidden');
  window._sampleFilter = window._sampleFilter || {q:'', collection:''};
  const f = window._sampleFilter;

  let items = data.samples.slice();
  if(f.collection) items = items.filter(s=>s.collection===f.collection);
  if(f.q){
    const q = f.q.toLowerCase();
    items = items.filter(s=>(s.name||'').toLowerCase().includes(q) || (s.manufacturer||'').toLowerCase().includes(q));
  }
  items.sort((a,b)=>(b.ts||0)-(a.ts||0));

  const approvedCount = data.samples.filter(s=>{ const lr=latestRound(s); return lr&&lr.verdict==='good'; }).length;
  const totalSampleCost = data.samples.reduce((s,x)=>s+(x.rounds||[]).reduce((ss,r)=>ss+n(r.cost),0),0);
  const totalPrice = data.samples.reduce((s,x)=>s+n(x.price),0);
  const cols = allCollections();

  $('page-content').innerHTML = `
    ${sectionTabsHtml()}
    <div class="filter-bar">
      <input type="text" placeholder="Search name or manufacturer..." value="${esc(f.q)}" oninput="setSampleFilter('q',this.value)"/>
      <select onchange="setSampleFilter('collection',this.value)" style="flex:1;min-width:130px;">
        <option value="">All Collections</option>

async function handleProfileUpload(sampleId, inputEl){
  const f = inputEl.files[0]; if(!f) return;
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const oldId = s.profilePhotoId;
  try{
    const res = await assetsApi.upload(f);
    s.profilePhotoId = res.id;
    renderSampleDetail(); toast('Photo updated');
    await persistSample(s);
    if(oldId) deleteAsset(oldId);
  }catch(e){ toast(friendlyUploadError(e), 3500); }
  inputEl.value='';
}
async function removeProfilePhoto(sampleId){
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const oldId = s.profilePhotoId;
  s.profilePhotoId = null;
  renderSampleDetail(); toast('Photo removed');
  await persistSample(s);
  if(oldId) deleteAsset(oldId);
}

async function handleTechPackUpload(sampleId, inputEl){
  const f = inputEl.files[0]; if(!f) return;
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  try{
    const res = await assetsApi.upload(f);
    s.techPacks = s.techPacks||[];
    s.techPacks.push({id:uid(), assetId:res.id, name:f.name, size:f.size, ts:Date.now()});
    renderSampleDetail(); toast('Tech pack uploaded');
    await persistSample(s);
  }catch(e){ toast(friendlyUploadError(e), 3500); }
  inputEl.value='';
}
function deleteTechPack(sampleId, tpId){
  confirmSheet('Delete this tech pack?', async ()=>{

    const tp = (s.techPacks||[]).find(x=>x.id===tpId);
    s.techPacks = (s.techPacks||[]).filter(x=>x.id!==tpId);
    renderSampleDetail(); toast('Tech pack deleted');
    await persistSample(s);

    <div class="field" style="margin-bottom:0"><label class="field-label">Note</label>
      <div class="input-wrap"><input id="ph-note-edit" type="text" value="${esc(p.note||'')}" placeholder="e.g. zip wrong colour"/></div></div>
    <button class="btn btn-dark" style="margin-top:14px;" onclick="savePhotoNote('${sampleId}','${photoId}')">Save Note</button>
    <button class="btn btn-red" style="margin-top:10px;" onclick="deletePhoto('${sampleId}','${photoId}')">Delete Photo</button>
  `;
  showSheet();
}
async function savePhotoNote(sampleId, photoId){
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const p = (s.photos||[]).find(x=>x.id===photoId); if(!p) return;
  p.note = $('ph-note-edit').value;
  closeSheet(); toast('Note updated'); navigate('detail', sampleId);
  await persistSample(s);
}
function deletePhoto(sampleId, photoId){
  confirmSheet('Delete this photo?', async ()=>{
    const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
    const p = (s.photos||[]).find(x=>x.id===photoId);
    s.photos = (s.photos||[]).filter(x=>x.id!==photoId);
    toast('Photo deleted'); navigate('detail', sampleId);
    await persistSample(s);
    if(p) deleteAsset(p.assetId);
  });
}

// ── SAMPLE ROUNDS ───────────────────────────────────────────────────────────
function openAddRound(sampleId, roundId){
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const existing = roundId ? (s.rounds||[]).find(r=>r.id===roundId) : null;
  window._roundVerdict = existing ? existing.verdict : 'pending';
  renderRoundSheet(sampleId, roundId, existing);
  showSheet();
}
function setRoundVerdict(sampleId, roundId, v){
  window._roundVerdict = v;
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  const existing = roundId ? (s.rounds||[]).find(r=>r.id===roundId) : null;
  const draft = {
    orderDate: readDateSelect('rd-order'),
    sampleDate: readDateSelect('rd-recv'),
    cost: $('rd-cost') ? $('rd-cost').value : '',
    notes: $('rd-notes') ? $('rd-notes').value : ''
  };
  renderRoundSheet(sampleId, roundId, existing, draft);
}
function renderRoundSheet(sampleId, roundId, existing, draft){
  const v = window._roundVerdict||'pending';
  const orderDate = draft ? draft.orderDate : ((existing&&existing.orderDate)||isoToday());
  const sampleDate = draft ? draft.sampleDate : ((existing&&existing.sampleDate)||'');
  const cost = draft ? draft.cost : ((existing&&existing.cost)||'');
  const notes = draft ? draft.notes : ((existing&&existing.notes)||'');
  $('sheet-content').innerHTML = `
    <div class="sheet-title">${existing?'Edit':'New'} Sample Round</div>
    <div class="field"><label class="field-label">Order Date</label>
      ${dateSelectHtml('rd-order', orderDate)}</div>
    <div class="field"><label class="field-label">Sample Received</label>
      ${dateSelectHtml('rd-recv', sampleDate)}</div>
    <div class="field"><label class="field-label">Verdict — Was It Good?</label>
      <div class="type-tabs">
        <button class="type-tab ${v==='good'?'active':''}" onclick="setRoundVerdict('${sampleId}','${roundId||''}','good')">Good</button>
        <button class="type-tab ${v==='bad'?'active':''}" onclick="setRoundVerdict('${sampleId}','${roundId||''}','bad')">Not Good</button>
        <button class="type-tab ${v==='pending'?'active':''}" onclick="setRoundVerdict('${sampleId}','${roundId||''}','pending')">Pending</button>
      </div>
    </div>
    <div class="field"><label class="field-label">Cost</label>
      <div class="input-wrap"><input id="rd-cost" type="number" inputmode="decimal" value="${cost}" placeholder="0.00"/><span class="input-suffix">€</span></div></div>
    <div class="field" style="margin-bottom:0"><label class="field-label">Notes</label>
      <div class="input-wrap"><input id="rd-notes" type="text" value="${esc(notes)}" placeholder="e.g. fabric was off, fit good..."/></div></div>
    <button class="btn btn-dark" style="margin-top:14px;" onclick="saveRound('${sampleId}','${roundId||''}')">${existing?'Save Changes':'Add Round'}</button>
  `;
}
async function saveRound(sampleId, roundId){
  const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
  s.rounds = s.rounds||[];
  const rec = {
    id: roundId||uid(),
    orderDate: readDateSelect('rd-order')||isoToday(),
    sampleDate: readDateSelect('rd-recv')||'',
    verdict: window._roundVerdict||'pending',
    cost: $('rd-cost').value,
    notes: $('rd-notes').value
  };
  if(roundId){
    const idx = s.rounds.findIndex(r=>r.id===roundId);
    if(idx>-1) s.rounds[idx]=rec; else s.rounds.push(rec);
  } else {
    s.rounds.push(rec);
  }
  closeSheet(); toast(roundId?'Round updated':'Round added'); navigate('detail', sampleId);
  await persistSample(s);
}
function deleteRound(sampleId, roundId){
  confirmSheet('Delete this sample round?', async ()=>{
    const s = data.samples.find(x=>x.id===sampleId); if(!s) return;
    s.rounds = (s.rounds||[]).filter(r=>r.id!==roundId);
    toast('Round deleted'); navigate('detail', sampleId);
    await persistSample(s);
  });
}

// ── INIT ────────────────────────────────────────────────────────────────────
(async function init(){
  await initCapabilities();
  await loadData();
  await migrateLegacyBulk();
  render();
})();
</script>
</body>
</html>
